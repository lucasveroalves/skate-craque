      if(o.nm==null&&(o.k=='crate'||o.k=='wall')&&o.z<0&&o.z>-1.4){o.nm=1;var dx_=Math.abs(pl-o.l);if(dx_>=.65&&dx_<1.35)nearMiss()}

      if(sup>0){cr+=3;snd(140,.15,'sawtooth',.07);shake=.15}
      else if(shd>0){shd=0;spark(pl*LW,1.5,0,'#64b5f6',20,8);msg={s:'🛡️ Escudo salvou!',t:1.2};snd(300,.3,'triangle',.08);vib(40)}else if(inv<=0){hp--;cbar=0;lastHit=0;vib(170);inv=1.3;shake=.35;if(!air)vy=6;snd(110,.3,'sawtooth',.09);if(hp<=0){over();if(rec){rec=0;msg={s:'🏆 NOVO RECORDE!',t:99};confetti()}}}});
    var ra=0,rb=0,rc=0,rd=0;gbv=0;if(tk){tk.t+=dt/TD[tk.type];var an=Math.min(1,tk.t)*6.2832,ty_=tk.type;if(ty_==0)rc=an;else if(ty_==1)ra=an;else if(ty_==2)rb=an;else if(ty_==3)gbv=Math.sin(Math.min(1,tk.t)*Math.PI);else rd=an;if(tk.t>=1)tk=null}
